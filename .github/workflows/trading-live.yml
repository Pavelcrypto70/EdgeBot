name: EdgeBot live entries (whitelist)

# Входы по whitelist. GitHub cron минимум раз в 5 мин;
# дополнительно после успеха ставим следующий тик через ~55 сек (секрет EDGEBOT_TICK_TOKEN).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: edgebot-trading-live
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e .

      - name: Live trading tick (whitelist only)
        env:
          EDGEBOT_DEMO: "auto"
          BYBIT_DATA_HOST: "public"
          BYBIT_TESTNET: "false"
          BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY }}
          BYBIT_API_SECRET: ${{ secrets.BYBIT_API_SECRET }}
        run: python -m edgebot.cli trading-book

      - name: Commit trading state
        run: |
          set -e
          git config user.name "edgebot-bot"
          git config user.email "edgebot-bot@users.noreply.github.com"
          cp docs/data/trading.json /tmp/trading.json
          cp docs/data/trading_state.json /tmp/trading_state.json
          git fetch origin main
          git reset --hard origin/main
          mkdir -p docs/data
          cp /tmp/trading.json docs/data/trading.json
          cp /tmp/trading_state.json docs/data/trading_state.json
          git add docs/data/trading.json docs/data/trading_state.json
          if git diff --staged --quiet; then
            echo "No trading changes"
            exit 0
          fi
          git commit -m "chore: live trading tick $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:main

      - name: Queue next tick (~1 min)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.EDGEBOT_TICK_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "EDGEBOT_TICK_TOKEN не задан — только cron */5"
            exit 0
          fi
          # не держим раннер минуту: планируем следующий dispatch после короткой паузы
          sleep 55
          gh workflow run "EdgeBot live entries (whitelist)" --ref main
          echo "queued next tick"
