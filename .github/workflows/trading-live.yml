name: EdgeBot live entries (whitelist)

# Частый прогон ТОЛЬКО по whitelist: график → сигнал → вход/выход.
# Полный ресёрч whitelist — autonomous.yml раз в ~4 часа.
on:
  schedule:
    # каждую минуту UTC (GitHub иногда чуть задерживает очередь)
    - cron: "* * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: edgebot-trading-live
  # один тик за раз — иначе конфликты при пуше каждую минуту
  cancel-in-progress: false
  # pending ждут очереди (GitHub Actions)

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e .

      - name: Live trading tick (whitelist only)
        env:
          EDGEBOT_DEMO: "auto"
          BYBIT_DATA_HOST: "public"
          BYBIT_TESTNET: "false"
        run: python -m edgebot.cli trading-book

      - name: Commit trading state
        run: |
          set -e
          git config user.name "edgebot-bot"
          git config user.email "edgebot-bot@users.noreply.github.com"
          # Свежий тик важнее merge: копируем файлы, синкаемся с main, кладём поверх, пушим.
          cp docs/data/trading.json /tmp/trading.json
          cp docs/data/trading_state.json /tmp/trading_state.json
          git fetch origin main
          git reset --hard origin/main
          mkdir -p docs/data
          cp /tmp/trading.json docs/data/trading.json
          cp /tmp/trading_state.json docs/data/trading_state.json
          git add docs/data/trading.json docs/data/trading_state.json
          if git diff --staged --quiet; then
            echo "No trading changes"
            exit 0
          fi
          git commit -m "chore: live trading tick $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:main
