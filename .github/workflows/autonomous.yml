name: EdgeBot autonomous scan

on:
  schedule:
    # каждый час (не на :00 — меньше дропа из‑за нагрузки GitHub)
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: edgebot-autonomous
  cancel-in-progress: false

jobs:
  scan-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e .

      - name: Autonomous scan
        id: scan
        continue-on-error: true
        env:
          # auto: при 403 Bybit с IP Actions уйдём в demo-бары, сайт всё равно обновится
          EDGEBOT_DEMO: "auto"
          BYBIT_DATA_HOST: "public"
          BYBIT_TESTNET: "false"
        run: python -m edgebot.cli autonomous --heavy 6 --fast 14

      - name: Commit public data
        run: |
          git config user.name "edgebot-bot"
          git config user.email "edgebot-bot@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: autonomous whitelist refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
